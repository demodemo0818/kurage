org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 の既定 (true) からのオプトアウト。Flutter 3.47 のテンプレートも false のまま。
# builtInKotlin: まだ自前で Kotlin Gradle Plugin を apply するプラグインが多数あり、
#   true にするとビルドが通らない (ビルドログの「plugins that apply Kotlin Gradle Plugin」一覧)。
# newDsl: Flutter の Gradle プラグイン自体が旧 DSL / 旧 Variant API を使っている。
# どちらも AGP 10 で廃止予定なので、Flutter とプラグインの対応を待って外す。
android.builtInKotlin=false
android.newDsl=false
